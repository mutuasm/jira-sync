[project]
name = "jira_sync"
authors = [{ name = "Steve Mutua", email = "smutua@dimetechgroup.com" }]
description = "Two-way sync between ERPNext Projects and Jira"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
